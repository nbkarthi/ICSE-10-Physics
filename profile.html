<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your details · ICSE Physics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f5f9;--panel:#fff;--fg:#14202e;--muted:#566779;--line:#d3dce6;--accent:#1d4ed8;--accent-fg:#fff;--err:#b42318;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;--font-body:'Nunito Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--panel:#162231;--fg:#e7eef6;--muted:#9db0c4;--line:#2a3b4e;--accent:#7aa2ff;--accent-fg:#0e1621;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--panel:#162231;--fg:#e7eef6;--muted:#9db0c4;--line:#2a3b4e;--accent:#7aa2ff;--accent-fg:#0e1621;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:var(--font-body);padding:24px 16px}
main{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
form{display:flex;flex-direction:column;gap:16px}
p{margin:0}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-size:1.8rem;line-height:1.1;margin:4px 0 8px}
.sub{color:var(--muted);margin-bottom:16px}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
label small{font-weight:400;color:var(--muted)}
input{font:inherit;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;min-height:44px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{color:var(--err);min-height:1.4em;font-size:14px}
</style>
<script src="theme.js"></script>
</head>
<body>
<main>
  <p class="eyebrow">Welcome</p>
  <h1>Tell us about you</h1>
  <p class="sub">We ask this once. Your name will appear on your dashboard.</p>
  <form id="f" novalidate>
    <label for="fullName">Full name
      <input id="fullName" name="fullName" autocomplete="name" required maxlength="80">
    </label>
    <label for="school">School <small>(optional)</small>
      <input id="school" name="school" autocomplete="organization" maxlength="100">
    </label>
    <p id="msg" role="alert"></p>
    <button id="go" type="submit">Save and start learning</button>
  </form>
</main>
<script>
var f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go'),nameEl=document.getElementById('fullName');
fetch('/api/me').then(function(r){
  if(r.status===401){location.replace('/login.html');return}
  return r.json().then(function(me){nameEl.value=me.fullName||me.name||'';document.getElementById('school').value=me.school||''});
}).catch(function(){});
f.addEventListener('submit',async function(e){
  e.preventDefault();msg.textContent='';
  if(nameEl.value.trim().length<2){msg.textContent='Enter your full name.';nameEl.focus();return}
  go.disabled=true;
  try{
    var res=await fetch('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fullName:nameEl.value,school:document.getElementById('school').value})});
    if(res.ok){location.replace('/');return}
    var d=await res.json().catch(function(){return {}});
    msg.textContent=res.status===401?'Your session ended. Please sign in again.':(d.detail||'Could not save. Please try again.');
  }catch(x){msg.textContent='Could not reach the server. Try again.'}
  go.disabled=false;
});
</script>
</body>
</html>
